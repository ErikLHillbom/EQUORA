[project]
name = "make-voice"
version = "0.1.0"
description = "Placeholder tag phrases with Meta MMS-TTS (CC BY-NC 4.0). Not shipped with the app."
requires-python = ">=3.11,<3.13"
dependencies = [
  "transformers>=4.44",
  "torch>=2.3",
  "scipy>=1.13",
  "soundfile>=0.12",
  "uroman>=1.3",
  "numpy",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
