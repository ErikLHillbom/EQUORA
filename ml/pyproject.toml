[project]
name = "equid_ml"
version = "0.1.0"
description = "Training, evaluation and export of the Equid Sentinel activity classifier"
requires-python = ">=3.12,<3.13"
dependencies = [
    "scikit-learn>=1.5",
    "numpy>=2.0",
    "pandas>=2.2",
    "emlearn>=0.21",
    # emlearn imports distutils, which Python 3.12 removed; setuptools provides it.
    "setuptools>=70",
    "remotezip>=0.12",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["equid_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
